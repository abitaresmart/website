    read: "Leggi la guida"
    min_read: "min di lettura"
  faq:
    eyebrow: "Domande frequenti"
    title: "Partiamo dalle cose importanti."
    items:
      - q: "Devo sostituire i dispositivi che ho già?"
        a: "Non necessariamente. Il primo passo è una verifica di compatibilità: spesso possiamo integrare ciò che funziona già e intervenire solo dove porta un vantaggio reale."
      - q: "Funziona anche se manca internet?"
        a: "Progettiamo le funzioni essenziali perché continuino a lavorare in locale quando l’ecosistema lo consente. Internet resta utile per il controllo remoto e alcuni servizi cloud, ma non dovrebbe essere un punto unico di guasto."
      - q: "Posso iniziare da una sola stanza?"
        a: "Sì. Disegniamo una base scalabile: puoi partire da illuminazione, clima o sicurezza e ampliare il sistema nel tempo senza ricominciare da zero."
      - q: "Lavorate solo su case nuove?"
        a: "No. Interveniamo sia in nuove costruzioni e ristrutturazioni sia in abitazioni già vissute, scegliendo soluzioni cablate o wireless in base allo spazio."
      - q: "Quanto costa un progetto?"
        a: "Dipende da obiettivi, dimensioni e infrastruttura esistente. Dopo il primo incontro prepariamo una proposta modulare e trasparente, così puoi decidere priorità e fasi."
