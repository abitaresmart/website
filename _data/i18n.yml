        title: "La luce giusta, prima ancora di chiederla."
        body: "Scenari che seguono l’ora, la presenza e l’attività, con controllo manuale sempre a portata di mano."
      - image: "/assets/img/redesign/project-control.webp"
        alt: "Camera da letto con pannello di controllo smart discreto a parete"
        tag: "Controllo + Comfort"
