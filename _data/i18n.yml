    eyebrow: "Frequently asked"
    title: "Let’s start with what matters."
    items:
      - q: "Do I need to replace the devices I already own?"
        a: "Not necessarily. We start with a compatibility audit: we can often integrate what already works and change only what creates a meaningful improvement."
      - q: "Will it work without internet access?"
        a: "Where the ecosystem permits, we design essential functions to keep running locally. Internet remains useful for remote control and some cloud services, but it should not be a single point of failure."
      - q: "Can I begin with just one room?"
        a: "Yes. We design a scalable foundation, so you can begin with lighting, climate, or security and expand later without starting over."
      - q: "Do you only work on new homes?"
        a: "No. We work with new builds and renovations as well as occupied homes, choosing wired or wireless solutions to suit the space."
      - q: "What does a project cost?"
        a: "It depends on the goals, size, and existing infrastructure. After the first conversation we prepare a transparent, modular proposal so you can choose priorities and phases."
