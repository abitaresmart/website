<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B211F">
  <meta name="color-scheme" content="light">
  {%- seo -%}
  {% assign lang = page.lang | default: site.lang | default: "it" %}
  {% if page.translation_url %}
    <link rel="alternate" hreflang="{% if lang == 'en' %}it{% else %}en{% endif %}" href="{{ page.translation_url | absolute_url }}">
  {% endif %}
  <link rel="alternate" hreflang="{{ lang }}" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicons/favicon-96x96.png">
  <link rel="shortcut icon" href="/assets/img/favicons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicons/apple-touch-icon.png">
  <link rel="manifest" href="/assets/img/favicons/site.webmanifest">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/manrope-200-800-latin.woff2">
  {% if page.home %}<link rel="preload" as="image" href="/assets/img/redesign/hero-smart-home.webp" fetchpriority="high">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/abitaresmart-signal.css' | relative_url }}">
  {%- feed_meta -%}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
