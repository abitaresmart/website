layout: default
---
<section class="page-hero">
  <div class="container reveal">
    {% if page.eyebrow %}<p class="eyebrow"><span></span>{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>

</section>
<section class="page-content">
  <div class="container">
    <div class="prose reveal">{{ content }}</div>
  </div>
</section>
